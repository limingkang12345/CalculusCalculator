<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MathLive Formula Input</title>
    <link rel="stylesheet" href="mathlive/dist/mathlive-static.css">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 10px;
            background: #fafafa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #status {
            display: none; /* hide status to save space */
        }
        math-field {
            display: block;
            width: 100%;
            min-height: 50px;
            padding: 8px 12px;
            font-size: 24px;
            border: 2px solid #3498db;
            border-radius: 8px;
            background: #fff;
            flex-shrink: 0;
        }
        .toolbar {
            margin-top: 8px;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        button {
            padding: 6px 16px;
            border: none;
            border-radius: 4px;
            background: #3498db;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }
        .output {
            margin-top: 10px;
            padding: 8px 12px;
            background: #ecf0f1;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            flex-shrink: 0;
        }
        .keyboard-container {
            flex: 1;
            min-height: 0;
            margin-top: 8px;
            position: relative;
        }
    </style>
</head>
<body>
    <div id="status" class="ok">Loading...</div>

    <math-field
        id="mf"
        virtual-keyboard-mode="always"
        locale="en"
        placeholder="Type a formula, e.g. x^2 + y^2 = 1"
        style="min-height: 50px;"
    ></math-field>

    <div class="toolbar">
        <button id="clearBtn">Clear</button>
    </div>
    <div class="output">
        <strong>LaTeX:</strong> <span id="latexDisplay">(empty)</span>
    </div>

    <script src="mathlive/dist/mathlive.min.js"></script>
    <script>
        // Set global language
        if (typeof MathfieldElement !== 'undefined' && MathfieldElement.locale !== undefined) {
            MathfieldElement.locale = 'en';
        }

        window.addEventListener('load', function() {
            const mf = document.getElementById('mf');
            const latexDisplay = document.getElementById('latexDisplay');

            const keyboard = window.mathVirtualKeyboard;
            if (keyboard && keyboard.show) {
                keyboard.show();
            }

            mf.addEventListener('input', function() {
                latexDisplay.textContent = mf.value || '(empty)';
            });
            if (mf.value) latexDisplay.textContent = mf.value;

            document.getElementById('clearBtn').addEventListener('click', function() {
                mf.value = '';
                latexDisplay.textContent = '(empty)';
            });

            console.log('MathLive initialized (keyboard always visible)');
        });
    </script>
</body>
</html>
