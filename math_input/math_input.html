<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MathLive 公式输入</title>
    <link rel="stylesheet" href="mathlive/dist/mathlive-static.css">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 10px;
            background: #fafafa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #status {
            display: none; /* 隐藏状态，节省空间 */
        }
        math-field {
            display: block;
            width: 100%;
            min-height: 50px;
            padding: 8px 12px;
            font-size: 24px;
            border: 2px solid #3498db;
            border-radius: 8px;
            background: #fff;
            flex-shrink: 0;
        }
        .toolbar {
            margin-top: 8px;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        button {
            padding: 6px 16px;
            border: none;
            border-radius: 4px;
            background: #3498db;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }
        .output {
            margin-top: 10px;
            padding: 8px 12px;
            background: #ecf0f1;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            flex-shrink: 0;
        }
        /* 让键盘区域占据剩余空间 */
        .keyboard-container {
            flex: 1;
            min-height: 0;
            margin-top: 8px;
            position: relative;
        }
        /* math-virtual-keyboard 是 MathLive 创建的 shadow DOM 元素，这里不需要额外样式 */
    </style>
</head>
<body>
    <div id="status" class="ok">⏳ 加载中...</div>

    <math-field
        id="mf"
        virtual-keyboard-mode="always"
        locale="zh-CN"
        placeholder="在此输入公式，例如 x^2 + y^2 = 1"
        style="min-height: 50px;"
    ></math-field>

    <div class="toolbar">
        <button id="clearBtn">🗑️ 清空</button>
    </div>
    <div class="output">
        <strong>LaTeX：</strong> <span id="latexDisplay">（空）</span>
    </div>

    <!-- 键盘会自动显示在 math-field 下方，无需额外容器 -->

    <script src="mathlive/dist/mathlive.min.js"></script>
    <script>
        // 设置全局语言
        if (typeof MathfieldElement !== 'undefined' && MathfieldElement.locale !== undefined) {
            MathfieldElement.locale = 'zh-CN';
        }

        // MathLive 取出的 LaTeX 中，单字符参数常省略花括号（如 \sqrt3、\frac12），
        // 这类写法无法被 sympify 解析，插入后会变成「不规范的表达式输入」。
        // 这里在取值处就把花括号补齐，显示与回填都使用补全后的结果。
        const ONE_ARG_COMMANDS = [
            '\\sqrt', '\\overline', '\\underline', '\\vec', '\\hat', '\\bar', '\\tilde',
            '\\dot', '\\ddot', '\\acute', '\\grave', '\\breve', '\\check', '\\mathring',
            '\\mathrm', '\\mathbf', '\\mathbb', '\\mathcal', '\\mathfrak', '\\mathit',
            '\\mathsf', '\\mathtt', '\\mathscr', '\\boldsymbol', '\\pmb',
            '\\text', '\\textbf', '\\textit', '\\operatorname'
        ];
        const TWO_ARG_COMMANDS = [
            '\\frac', '\\dfrac', '\\tfrac', '\\cfrac', '\\binom', '\\dbinom',
            '\\tbinom', '\\overset', '\\underset'
        ];
        // 无花括号即不合法的旧式写法
        const LEGACY_COMMANDS = {
            '\\mathbbR': '\\mathbb{R}', '\\mathbbC': '\\mathbb{C}',
            '\\mathbbN': '\\mathbb{N}', '\\mathbbQ': '\\mathbb{Q}',
            '\\mathbbZ': '\\mathbb{Z}'
        };

        // 读取一个参数：已有花括号则原样取出，否则把整个记号包进花括号
        function readLatexGroup(text, pos) {
            if (pos >= text.length) return ['', pos];
            if (text[pos] === '{') {
                let depth = 0;
                for (let k = pos; k < text.length; k++) {
                    if (text[k] === '{') depth++;
                    else if (text[k] === '}') {
                        depth--;
                        if (depth === 0) return [text.slice(pos, k + 1), k + 1];
                    }
                }
                return [text.slice(pos), text.length];
            }
            let end = pos + 1;
            if (text[pos] === '\\') {
                while (end < text.length && /[a-zA-Z]/.test(text[end])) end++;
            }
            return ['{' + text.slice(pos, end) + '}', end];
        }

        function normalizeLatex(src) {
            if (!src) return '';
            let text = src;
            for (const legacy in LEGACY_COMMANDS) {
                text = text.split(legacy).join(LEGACY_COMMANDS[legacy]);
            }
            const out = [];
            let pos = 0;
            while (pos < text.length) {
                if (text[pos] !== '\\') { out.push(text[pos]); pos++; continue; }
                const matched = /^\\[a-zA-Z]+/.exec(text.slice(pos));
                if (!matched) { out.push(text[pos]); pos++; continue; }
                const command = matched[0];
                pos += command.length;
                out.push(command);
                let count = TWO_ARG_COMMANDS.indexOf(command) >= 0 ? 2
                    : (ONE_ARG_COMMANDS.indexOf(command) >= 0 ? 1 : 0);
                if (count === 0) continue;
                // 根式可带可选参数 [n]，先跳过再取真正的参数
                if (command === '\\sqrt' && text[pos] === '[') {
                    const close = text.indexOf(']', pos);
                    if (close > 0) { out.push(text.slice(pos, close + 1)); pos = close + 1; }
                }
                for (let k = 0; k < count; k++) {
                    while (pos < text.length && ' \t\r\n'.indexOf(text[pos]) >= 0) {
                        out.push(text[pos]); pos++;
                    }
                    const group = readLatexGroup(text, pos);
                    out.push(group[0]); pos = group[1];
                }
            }
            return out.join('');
        }

        // 供 Python 端读取：返回补全花括号后的 LaTeX
        window.mathInputValue = function () {
            return normalizeLatex(document.getElementById('mf').value);
        };

        // 页面加载完成后，确保键盘可见
        window.addEventListener('load', function() {
            const mf = document.getElementById('mf');
            const latexDisplay = document.getElementById('latexDisplay');

            // 强制显示键盘（尽管 virtual-keyboard-mode="always" 应自动显示）
            const keyboard = window.mathVirtualKeyboard;
            if (keyboard && keyboard.show) {
                keyboard.show();
            }

            // 实时显示 LaTeX（补全花括号后的形式）
            const refresh = function () {
                latexDisplay.textContent = normalizeLatex(mf.value) || '（空）';
            };
            mf.addEventListener('input', refresh);
            refresh();

            // 清空
            document.getElementById('clearBtn').addEventListener('click', function() {
                mf.value = '';
                refresh();
            });

            console.log('✅ MathLive 初始化完成（键盘始终显示）');
        });
    </script>
</body>
</html>
